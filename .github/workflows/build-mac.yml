name: Build macOS installer

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (universal arm64 + x86_64)
        run: |
          cmake -B build -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build plugins
        run: cmake --build build --config Release -j 4

      - name: Collect, ad-hoc sign
        run: |
          mkdir -p stage/vst3 stage/au
          for t in knotwork alloy fogbank abacus; do
            cp -R build/${t}_artefacts/Release/VST3/*.vst3 stage/vst3/
            cp -R build/${t}_artefacts/Release/AU/*.component stage/au/
          done
          for b in stage/vst3/*.vst3 stage/au/*.component; do
            codesign --force --deep --sign - "$b"
          done
          python3 marbles-m4l/build-tools/make_amxd.py
          mkdir -p stage/m4l/DICEBAG
          cp marbles-m4l/build/DICEBAG.amxd marbles-m4l/build/*.js stage/m4l/DICEBAG/

      - name: Validate Audio Units
        continue-on-error: true
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R stage/au/*.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aumu Knot Klbs || true
          auval -v aumu Allo Klbs || true
          auval -v aumf Fogb Klbs || true
          auval -v aumf Abac Klbs || true

      - name: Build installer (.pkg)
        run: bash installer/make_pkg.sh "${GITHUB_REF_NAME}"

      - uses: actions/upload-artifact@v4
        with:
          name: kalabash-modules-mac
          path: |
            dist/*.pkg
            dist/*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.pkg
            dist/*.zip
