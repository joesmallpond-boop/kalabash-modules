name: Build macOS installer

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        run: echo "KB_VERSION=$(cat VERSION)" >> "$GITHUB_ENV"

      - name: Configure (universal arm64 + x86_64)
        run: |
          cmake -B build -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build plugins
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --config Release -j 4 2>&1 | tee build.log || {
            echo "::group::compiler errors"; grep -n -E "error:|Error [0-9]" build.log | head -80; echo "::endgroup::"
            grep -E "error:" build.log | head -20 | while read -r l; do echo "::error::$l"; done
            exit 1; }

      - name: Build Max externals (for the Max for Live devices)
        shell: bash
        run: |
          set -o pipefail
          git clone --depth 1 https://github.com/Cycling74/max-sdk-base.git max-sdk-base
          cmake -S m4l/externals -B build-ext -G "Unix Makefiles" \
            -DMAX_SDK_BASE="$PWD/max-sdk-base" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build-ext -j 4 2>&1 | tee ext.log || {
            grep -E "error:" ext.log | head -20 | while read -r l; do echo "::error::$l"; done
            exit 1; }
          ls build-ext/externals

      - name: Collect, ad-hoc sign
        run: |
          mkdir -p stage/vst3 stage/au
          for t in knotwork alloy fogbank abacus; do
            cp -R build/${t}_artefacts/Release/VST3/*.vst3 stage/vst3/
            cp -R build/${t}_artefacts/Release/AU/*.component stage/au/
          done
          for b in stage/vst3/*.vst3 stage/au/*.component; do
            codesign --force --deep --sign - "$b"
          done
          python3 marbles-m4l/build-tools/make_amxd.py
          mkdir -p stage/m4l/DICEBAG
          cp marbles-m4l/build/DICEBAG.amxd marbles-m4l/build/*.js stage/m4l/DICEBAG/
          (cd m4l/build-tools && python3 make_devices.py)
          mkdir -p stage/m4l/externals
          cp -R build-ext/externals/*.mxo stage/m4l/externals/
          for b in stage/m4l/externals/*.mxo; do codesign --force --deep --sign - "$b"; done
          for d in KNOTWORK ALLOY FOGBANK ABACUS; do
            mkdir -p stage/m4l/$d
            cp m4l/build/$d.amxd stage/m4l/$d/
            lc=$(echo $d | tr A-Z a-z)
            cp -R "stage/m4l/externals/kb.${lc}~.mxo" stage/m4l/$d/
          done

      - name: Validate Audio Units
        continue-on-error: true
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R stage/au/*.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aumu Knot Klbs || true
          auval -v aumu Allo Klbs || true
          auval -v aufx Fogb Klbs || true
          auval -v aufx Abac Klbs || true

      - name: Build installer (.pkg) + zip
        run: bash installer/make_pkg.sh "$(cat VERSION)"

      - uses: actions/upload-artifact@v4
        with:
          name: kalabash-modules-mac
          path: dist/*.zip

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.KB_VERSION }}
          name: kalabash modules
          make_latest: true
          files: dist/*.zip
